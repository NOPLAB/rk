[env]
# OCCT's CMakeLists still asks for a `cmake_minimum_required` below 3.5, which
# CMake 4 refuses outright. Without this the default build dies in
# occt-sys' configure step on any machine with a current CMake — and the
# default build is the OpenCASCADE one.
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
