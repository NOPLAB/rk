[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["nop"]

[workspace.dependencies]
# Graphics
wgpu = "27.0"
egui = "0.33"
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts"] }
egui_dock = "0.18"
egui-wgpu = "0.33"

# Math
glam = { version = "0.29", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }

# Mesh formats
stl_io = "0.7"
urdf-rs = "0.9"
tobj = "4"
dae-parser = "0.11"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"

# CAD kernels
# OpenCASCADE: GitHub version with default-features = false to link against pre-installed OCCT
opencascade-sys = { git = "https://github.com/NOPLAB/opencascade-rs", default-features = false }
cxx = "1.0"
truck-modeling = "0.6"
truck-meshalgo = "0.4"
truck-topology = "0.6"
truck-polymesh = "0.6"
truck-shapeops = "0.4"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rfd = "0.15"
ureq = { version = "3", features = ["json"] }
semver = "1"
open = "5"
dirs = "6"

# Build / test
winres = "0.1"
approx = "0.5"
tempfile = "3"

# Internal crates
rk-core = { path = "crates/rk-core" }
rk-cad = { path = "crates/rk-cad" }
rk-renderer = { path = "crates/rk-renderer" }
