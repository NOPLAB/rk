name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

# The Tauri app is the product; `tauri build` compiles the Rust shell, the
# React bundle and the installers in one step. The CAD kernel is OpenCASCADE
# built from source, so every job needs CMake and a C++ toolchain — that is
# what the sccache CMake launchers below are for.

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Stamp the release version
        if: github.ref_type == 'tag'
        shell: bash
        run: node .github/scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis
        working-directory: apps/desktop
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install build dependencies
        run: brew install cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Stamp the release version
        if: github.ref_type == 'tag'
        run: node .github/scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build the installer
        run: npm run tauri build -- --bundles dmg
        working-directory: apps/desktop
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # webkit2gtk is the webview Tauri renders into; cmake and clang build
      # OCCT. 24.04 carries webkit2gtk-4.1 only
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf \
            file \
            cmake \
            clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Stamp the release version
        if: github.ref_type == 'tag'
        run: node .github/scripts/stamp-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Build the installers
        run: npm run tauri build -- --bundles deb,appimage
        working-directory: apps/desktop
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          APPIMAGE_EXTRACT_AND_RUN: 1

      # One artifact each: given two paths, upload-artifact roots the archive
      # at their common ancestor and the files arrive under deb/ and appimage/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Only a tag has a version to publish under. A manual run builds and uploads
  # the artifacts, which is what makes it useful as a dry run of the pipeline.
  release:
    name: Create Release
    if: github.ref_type == 'tag'
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # No `|| true` here: a bundle that failed to arrive must fail the
      # release rather than publish it half empty
      - name: Prepare assets
        run: |
          set -euo pipefail
          mkdir -p release
          VERSION="${GITHUB_REF_NAME#v}"

          cp artifacts/windows-installer/*.exe "release/rk-${VERSION}-windows-x64-setup.exe"
          cp artifacts/macos-installer/*.dmg "release/rk-${VERSION}-macos-arm64.dmg"
          cp artifacts/linux-deb/*.deb "release/rk_${VERSION}_amd64.deb"
          cp artifacts/linux-appimage/*.AppImage "release/rk-${VERSION}-x86_64.AppImage"

          cd release && sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
