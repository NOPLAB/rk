[package]
name = "rk-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CAD kernel abstraction and sketch system for RK"

[features]
default = ["truck"]
opencascade = ["dep:opencascade-sys", "dep:cxx"]
truck = ["dep:truck-modeling", "dep:truck-meshalgo", "dep:truck-topology", "dep:truck-polymesh", "dep:truck-shapeops"]

[dependencies]
uuid = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }

# Optional: OpenCASCADE (C++ bindings)
opencascade-sys = { workspace = true, optional = true }
cxx = { workspace = true, optional = true }

# Optional: Truck (Pure Rust B-Rep)
truck-modeling = { workspace = true, optional = true }
truck-meshalgo = { workspace = true, optional = true }
truck-topology = { workspace = true, optional = true }
truck-polymesh = { workspace = true, optional = true }
truck-shapeops = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
